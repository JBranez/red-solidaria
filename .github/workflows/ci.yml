name: CI - Red Solidaria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pruebas y contratos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias del sistema ODBC
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev
      - name: Instalar dependencias Python
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Ejecutar suite backend
        env:
          APP_ENV: test
          JWT_SECRET_KEY: ci-secret-for-tests-only-0123456789abcdef
          DB_APP_PASSWORD: ci-password
        run: python -m pytest -q

  frontend:
    name: Frontend · pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas frontend
        run: npm test -- --watch=false
      - name: Compilar producción
        run: npm run build
